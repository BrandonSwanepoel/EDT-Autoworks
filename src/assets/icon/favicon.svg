<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- EDT Autoworks favicon: simplified bold monogram for tabs and search results -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e6ebf2"/>
      <stop offset="0.56" stop-color="#b8c2d0"/>
      <stop offset="1" stop-color="#dfe5ee"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4b53"/>
      <stop offset="0.55" stop-color="#ff1e27"/>
      <stop offset="1" stop-color="#c8000a"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect id="tile" width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Crimson racing rim -->
  <rect x="22" y="22" width="468" height="468" rx="76" fill="none" stroke="#ff1e27" stroke-width="14"/>

  <!-- Slanted EDT monogram -->
  <g transform="translate(256 256) scale(0.9) skewX(-10) translate(-256 -256)">
    <!-- E -->
    <path fill="url(#chrome)" d="M40 146 H170 V198 H92 V230 H155 V282 H92 V314 H170 V366 H40 Z"/>
    <!-- D -->
    <path fill="url(#chrome)" fill-rule="evenodd" d="M186 146 H276 Q326 146 326 196 V316 Q326 366 276 366 H186 Z M238 198 V314 H260 Q274 314 274 300 V212 Q274 198 260 198 Z"/>
    <!-- T -->
    <path fill="url(#red)" d="M342 146 H472 V198 H433 V366 H381 V198 H342 Z"/>
  </g>

  <!-- Speed underline -->
  <path d="M96 420 H330 L318 440 H84 Z" fill="#ff1e27"/>
  <path d="M346 420 H428 L416 440 H334 Z" fill="#e6ebf2"/>
</svg>
